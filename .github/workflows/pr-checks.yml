name: PR Quality Checks

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          args: --timeout 5m

      - run: go test -mod=vendor -race -count=1 ./...
