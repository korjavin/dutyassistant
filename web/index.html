<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster Bot — Schedule</title>
    <link href="/css/style.css?v=BUILD_TIME" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="page">
        <div class="shell">
            <header class="hdr">
                <div class="hdr-logo">
                    <span class="glyph"><span></span><span></span><span></span><span></span></span>
                    <span>Roster<span class="sep">·</span>Bot</span>
                    <span class="sub">v2.3</span>
                </div>
                <div class="hdr-user">
                    <span class="dot"></span>
                    <span id="hdr-user-name">@guest</span>
                </div>
            </header>

            <div class="status">
                <div class="status-cell">
                    <div class="v tn" id="stat-chores">00</div>
                    <div class="k">Open chores</div>
                </div>
                <div class="status-cell">
                    <div class="v tn" id="stat-queue">00</div>
                    <div class="k">Queue days</div>
                </div>
                <div class="status-cell">
                    <div class="v tn" id="stat-week">00</div>
                    <div class="k">This week</div>
                </div>
            </div>

            <section class="section" id="chores-section">
                <div class="section-hdr">
                    <div class="h">▍ Pending <span class="num" id="chores-count">[00]</span></div>
                </div>
                <div id="pending-chores-list">
                    <div class="spinner">Loading…</div>
                </div>
            </section>

            <section class="section" id="queue-section">
                <div class="section-hdr">
                    <div class="h">▍ Queue balance <span class="num" id="queue-count">[00]</span></div>
                    <div class="meta">V ▮ · A ▯</div>
                </div>
                <div id="queue-list">
                    <div class="spinner">Loading…</div>
                </div>
            </section>

            <section class="section" id="calendar-section">
                <div class="section-hdr">
                    <div class="h">▍ Schedule</div>
                    <div class="meta">mon→sun</div>
                </div>
                <div id="calendar-container">
                    <div class="spinner">Loading…</div>
                </div>
            </section>

            <section class="section">
                <div class="section-hdr">
                    <div class="h">▍ Legend</div>
                    <div class="meta">Types</div>
                </div>
                <div class="legend">
                    <div><span class="swatch vol"></span> Volunteered</div>
                    <div><span class="swatch admin"></span> Admin assigned</div>
                    <div><span class="swatch prog"></span> Prognosis (round-robin)</div>
                    <div><span class="swatch today"></span> Today</div>
                </div>
            </section>

            <footer class="foot">
                <span><span class="blink"></span>connected · telegram</span>
                <span id="foot-clock">↻ --:--</span>
            </footer>
        </div>
    </div>

    <script src="/js/main.js?v=BUILD_TIME" type="module"></script>
</body>
</html>
