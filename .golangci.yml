version: 2

run:
  timeout: 5m

linters:
  enable-all: false
  enable:
    - gosec
    - errcheck
    - govet
    - staticcheck
    - unused
    - misspell
    - nolintlint

formatters:
  enable:
    - gofumpt

linters-settings:
  gofumpt:
    extra-rules: true
  gosec:
    # No exclusions, standard ruleset
    includes: []
    excludes: []

issues:
  exclude-rules:
    # Suppress known false positives
    - path: _test\.go
      linters:
        - errcheck
        - gosec
